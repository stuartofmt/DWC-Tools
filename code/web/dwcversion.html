<page-frame title="Create DWC Version">
  <div class="d-flex align-center ga-4 flex-wrap">
    <v-select v-model="sel" :items="items" label="DWC version" hide-details class="pick-version"></v-select>
    <v-text-field v-if="sel === '__new'" v-model="typed" label="New version" placeholder="3.5.1 or 3.6-dev" persistent-placeholder
                  autocomplete="off" hide-details class="pick-version" @keydown.enter="ask"></v-text-field>
  </div>
  <job-panel api="/dwcversion/api" label="Start" icon="mdi-play" :can-start="!!version" @start="ask" @finished="loadOpts(lastVersion)"></job-panel>
  <v-dialog v-model="confirmAsk" max-width="460">
    <v-card title="Download again?" :text="`This deletes and re-downloads the existing ${version} folder. Continue?`">
      <v-card-actions>
        <v-spacer></v-spacer>
        <v-btn @click="confirmAsk = false">Cancel</v-btn>
        <v-btn color="error" variant="flat" @click="start">Delete and download</v-btn>
      </v-card-actions>
    </v-card>
  </v-dialog>
</page-frame>
