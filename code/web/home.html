<page-frame title="Prep and Package">
  <v-row>
    <v-col cols="12" sm="6">
      <v-card href="/prepare" variant="outlined" class="h-100" prepend-icon="mdi-package-variant-closed" title="Prepare"
              text="Make a project's requirements.txt from its imports, create its venv and install into it">
        <template #append><v-chip v-if="running.prepare" color="primary" size="small">running</v-chip></template>
      </v-card>
    </v-col>
    <v-col cols="12" sm="6">
      <v-card href="/workflow" variant="outlined" class="h-100" prepend-icon="mdi-source-branch-sync" title="Copy Plugin Release Workflow"
              text="Copy the GitHub release workflow for DWC plugins into a plugin's folder, ready to commit"></v-card>
    </v-col>
  </v-row>
  <p class="note mt-4">{{ project }}</p>
</page-frame>
